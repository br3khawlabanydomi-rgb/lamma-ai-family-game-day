nd','ادخار الميزانية هذه الجولة',0,0,0]]},{en:'A spice shipment arrives with changing demand.',ar:'تصل شحنة بهارات مع تغير الطلب.',opts:[['Stock premium spices (cost 15, sell 25)','شراء بهارات ممتازة (تكلفة ١٥، بيع ٢٥)',10,-15,0],['Stock basic spices (cost 7, sell 12)','شراء بهارات أساسية (تكلفة ٧، بيع ١٢)',5,-7,0],['Offer free hospitality','تقديم الضيافة مجاناً',2,-3,0]]},{en:'The final market day attracts many shoppers.',ar:'يجذب اليوم الأخير للسوق متسوقين كثيرين.',opts:[['Sell a gift bundle (cost 18, sell 30)','بيع باقة هدايا (تكلفة ١٨، بيع ٣٠)',12,-18,0],['Sell small souvenirs (cost 9, sell 15)','بيع تذكارات صغيرة (تكلفة ٩، بيع ١٥)',6,-9,0],['Keep money for next season','الاحتفاظ بالمال للموسم القادم',1,0,0]]}],oasis:[{en:'A new oasis settlement needs clean water and food.',ar:'تحتاج مستوطنة الواحة الجديدة إلى مياه نظيفة وغذاء.',opts:[['Build water-saving irrigation','إنشاء ري موفر للمياه',5,-3,0],['Plant a large palm garden','زراعة حديقة نخيل كبيرة',4,-5,2],['Repair the shared well','إصلاح البئر المشتركة',3,-2,0]]},{en:'Hot weather increases the community’s energy needs.',ar:'يزيد الطقس الحار احتياجات المجتمع للطاقة.',opts:[['Install solar panels','تركيب ألواح شمسية',6,-4,0],['Use diesel generators','استخدام مولدات ديزل',3,-3,3],['Insulate community buildings','عزل مباني المجتمع',4,-2,0]]},{en:'Families request a shared space and more shade.',ar:'تطلب العائلات مساحة مشتركة ومزيداً من الظل.',opts:[['Build shaded community garden','إنشاء حديقة مجتمعية مظللة',6,-4,0],['Build a large paved plaza','إنشاء ساحة كبيرة مرصوفة',3,-5,2],['Plant native shade trees','زراعة أشجار ظل محلية',5,-3,0]]}],football:[{en:'Your team has a corner kick. Which plan creates space?',ar:'لدى فريقك ركلة ركنية. أي خطة تخلق مساحة؟',opts:[['Use coordinated runs','استخدام تحركات منسقة',2,0,0],['Crowd the goalkeeper','التجمع حول الحارس',0,0,0],['Ignore your teammates','تجاهل الزملاء',0,0,0]]},{en:'The opponent presses high. How should your team respond?',ar:'يضغط الخصم في الأمام. كيف يستجيب فري const bonusScenarios={"football": [{"en": "A quick counterattack begins. Your family team has two attackers and one defender. How can you create a fair passing opportunity?", "ar": "تبدأ هجمة مرتدة سريعة. لدى فريق العائلة مهاجمان ومدافع واحد. كيف تصنع فرصة تمرير عادلة؟", "opts": [["Make a supporting run into open space", "التحرك إلى مساحة خالية لدعم الزميل", 2, 0, 0], ["Both attackers chase the same spot", "يتجه المهاجمان إلى المكان نفسه", 0, 0, 0], ["Stop and argue about possession", "التوقف والجدال حول الكرة", 0, 0, 0]]}, {"en": "Your goalkeeper distributes the ball after a save. Which plan helps your team keep possession?", "ar": "يوزع حارس المرمى الكرة بعد التصدي. أي خطة تساعد الفريق على الاحتفاظ بها؟", "opts": [["Offer a safe short passing option", "توفير خيار تمرير قصير وآمن", 2, 0, 0], ["All players hide behind opponents", "اختباء اللاعبين خلف المنافسين", 0, 0, 0], ["Kick without looking", "الركل دون النظر", 0, 0, 0]]}], "pearl": [{"en": "An experienced navigator spots clouds near a distant pearl bank. The crew must preserve enough supplies for the journey home.", "ar": "يرصد ملاح خبير سحباً قرب منطقة لؤلؤ بعيدة. يجب حفظ مؤن كافية للعودة.", "opts": [["Visit the nearby bank and return early", "زيارة المنطقة القريبة والعودة مبكراً", 3, -1, 0], ["Rush to the far bank", "الإسراع إلى المنطقة البعيدة", 6, -4, 4], ["Check equipment before departing", "فحص المعدات قبل المغادرة", 1, 1, 0]]}, {"en": "The crew finds a damaged rope on the dhow. Repairing it costs time but improves safety.", "ar": "يجد الطاقم حبلاً تالفاً في المحمل. إصلاحه يستغرق وقتاً لكنه يزيد السلامة.", "opts": [["Repair the rope before diving", "إصلاح الحبل قبل الغوص", 2, -1, 0], ["Ignore the damage", "تجاهل التلف", 5, -3, 4], ["Return and restock", "العودة وتجديد المؤن", 1, 2, 0]]}], "falcon": [{"en": "The virtual falcon encounters rising warm air over the dunes. You need to conserve energy before the final checkpoint.", "ar": "يواجه الصقر الافتراضي تياراً هوائياً صاعداً فوق الكثبان. يجب توفير الطاقة A community school needs cooling and shaded outdoor space. Your materials are limited.", "ar": "تحتاج مدرسة مجتمعية إلى التبريد ومساحة خارجية مظللة. المواد محدودة.", "opts": [["Build shaded walkways", "إنشاء ممرات مظللة", 5, -3, 0], ["Add passive ventilation", "إضافة تهوية طبيعية", 6, -3, 0], ["Build a decorative fountain", "إنشاء نافورة للزينة", 2, -5, 3]]}]};
for(const id of Object.keys(bonusScenarios)) scenarios[id].push(...bonusScenarios[id]);
const t=k=>dict[lang][k]||k,loc=(en,ar)=>lang==='ar'?ar:en,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('lamma_save',JSON.stringify(state))}function toggleLang(){lang=lang==='en'?'ar':'en';localStorage.setItem('lamma_lang',lang);render()}function go(v,id){stopTimer();view=v;if(id){if(active!==id)game=null;active=id}persistGame();render();window.scrollTo(0,0)}function gameInfo(){return games.find(g=>g.id===active)}function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(x=>x.textContent=t(x.dataset.i));document.getElementById('langButton').textContent=lang==='en'?'العربية':'English';document.getElementById('tagline').textContent=loc('Five games. One family. Endless memories.','خمس ألعاب، عائلة واحدة، ذكريات لا تنتهي');const el=document.getElementById('app');el.innerHTML=view==='home'?home():view==='setup'?setup():view==='results'?results():play();}function home(){return `<section class="hero"><p style="font-weight:700">${loc('AI MODE: REVIEWED OFFLINE CONTENT — NOT LIVE AI','وضع الذكاء الاصطناعي: محتوى مراجع دون اتصال — ليس ذكاءً اصطناعياً مباشراً')}</p><h2>${t('welcome')}</h2><p>${t('intro')}</p><button class="gold" onclick="go('setup')">${t('setup')}</button></section><div class="grid">${games.map(g=>`<article class="card"><div class="emoji">${g.icon}</div><h3>${loc(g.en,g.ar)}</h3><p class="muted">${loc(g.desc,g.descAr)}</p><button onclick="go('play','${g.id}')">${t('play')}</button></article>`).join('')}</div>`}
function setup(){return `<h2>${t('setup')}</h2><div class="panel"><label>${t('players')} (${state.players.length})</label><div class="stack">${state.players.map((p,i)=>`<div class="row"><input aria-label="Player ${i+1}" value="${esc(p)}" onchange="renamePlayer(${i},this.value)"><button class="danger" onclick="removePlayer(${i})" ${state.players.length<=2?'disabled':''}>×</button></div>`).join('')}</div><p><button onclick="addPlayer()">+ ${t('add')}</button></p><div class="row"><div class="field"><label>${t('host')}</label><select onchange="changeHost(this.value)">${state.players.map(p=>`<option value="${esc(p)}" ${p===state.host?'selected':''}>${esc(p)}</option>`).join('')}</select></div></div><p class="muted">${loc('Assign each player to A or B. Solo games rotate through all players.','وزّع اللاعبين على الفريق أ أو ب. تتناوب الألعاب الفردية بين جميع اللاعبين.')}</p><div class="grid">${state.players.map(p=>`<div class="field"><label>${esc(p)}</label><select onchange="assignTeam('${encodeURIComponent(p)}',this.value)"><option value="A" ${state.teamA.includes(p)?'selected':''}>${t('teamA')}</option><option value="B" ${state.teamB.includes(p)?'selected':''}>${t('teamB')}</option></select></div>`).join('')}</div><p><button onclick="go('home')">${t('save')} ✓</button></p></div>`}
function renamePlayer(i,v){v=v.trim().slice(0,28)||`Player ${i+1}`;let old=state.players[i];if(state.players.some((p,j)=>j!==i&&p===v)){alert(loc('Names must be unique','يجب أن تكون الأسماء مختلفة'));render();return}state.players[i]=v;state.teamA=state.teamA.map(p=>p===old?v:p);state.teamB=state.teamB.map(p=>p===old?v:p);if(state.host===old)state.host=v;persist();render()}function removePlayer(i){let p=state.players.splice(i,1)[0];state.teamA=state.teamA.filter(x=>x!==p);state.teamB=state.teamB.filter(x=>x!==p);if(state.host===p)state.host=state.players[0];persist();render()}function addPlayer(){if(state.players.length>=12)return;let i=1;while(state.players.includes('Player '+i))i++;let p='Player '+i;state.players.push(p);state.teamB.push(p);persist();render()}function assignTeam(encoded,v){let p=decodeURIComponent(encoded);state.teamA=state.teamA.filter(x=>x!==p);state.teamB=state.teamB.filter(x=>x!==p);state[v==='A'?'teamA':'teamB'].push(p);persist();render()}
function persistGame(){try{localStorage.setItem('lamma_active',JSON.stringify({active,game:game?{...game,playing:false}:null}))}catch(e){console.warn(e)}}
function newGame(){stopTimer();let count=scenarios[active].length;game={round:0,scoreA:0,scoreB:0,starsA:0,starsB:0,selected:-1,turn:0,resources:active==='souq'?100:active==='oasis'?12:active==='falcon'?9:6,risk:0,finished:false,seconds:active==='football'?180:60,playing:false,history:[],turnScores:{},outcome:null,scenarioOrder:Array.from({length:count},(_,i)=>i).sort(()=>Math.random()-.5).slice(0,3),log:[]};persistGame();render()}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;if(game)game.playing=false}
function startTimer(){if(!game||game.finished||game.seconds===0)return;if(game.playing){stopTimer();persistGame();render();return}game.playing=true;timerHandle=setInterval(()=>{if(!game)return;game.seconds=Math.max(0,game.seconds-1);let e=document.getElementById('clock');if(e)e.textContent=formatTime(game.seconds);if(game.seconds===0){stopTimer();persistGame();render()}},1000);render()}
function resetTimer(){if(!game||game.finished)return;stopTimer();game.seconds=active==='football'?180:60;persistGame();render()}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function changeHost(value){if(!state.players.includes(value))return;state.host=value;persist();render()}
function renamePlayer(i,v){v=v.trim().slice(0,28)||`Player ${i+1}`;let old=state.players[i];if(state.players.some((p,j)=>j!==i&&p.toLowerCase()===v.toLowerCase())){alert(loc('Names must be unique','يجب أن تكون الأسماء مختلفة'));render();return}state.players[i]=v;state.teamA=state.teamA.map(p=>p===old?v:p);state.teamB=state.teamB.map(p=>p===old?v:p);if(state.host===old)state.host=v;persist();render()}
function removePlayer(i){if(state.players.length<=2)return;let p=state.players.splice(i,1)[0];state.teamA=state.teamA.filter(x=>x!==p);state.teamB=state.teamB.filter(x=>x!==p);if(state.host===p)state.host=state.players[0];persist();render()}
function addPlayer(){if(state.players.length>=12)return;let i=1;while(state.players.includes('Player '+i))i++;let p='Player '+i;state.players.push(p);state.teamB.push(p);persist();render()}
function assignTeam(encoded,v){let p=decodeURIComponent(encoded);if(!state.players.includes(p))return;state.teamA=state.teamA.filter(x=>x!==p);state.teamB=state.teamB.filter(x=>x!==p);state[v==='A'?'teamA':'teamB'].push(p);persist();render()}
function play(){let g=gameInfo();if(!g)return home();let isFootball=active==='football',isTeam=isFootball||active==='oasis';let rules={football:loc('The host starts a timed match, records real goals and confirms strategy missions. Missions award stars, never automatic goals.','يبدأ المضيف مباراة مؤقتة ويسجل الأهداف الفعلية ويؤكد المهمات التكتيكية. تمنح المهمات نجوماً لا أهدافاً تلقائية.'),pearl:loc('Take turns planning a pearl-diving expedition. Manage supplies, collect pearls, and avoid risks across three rounds.','تبادل الأدوار في تخطيط رحلة الغوص. أدر المؤن واجمع اللؤلؤ وتجنب المخاطر عبر ثلاث جولات.'),falcon:loc('Take turns choosing safe routes for your virtual falcon. Manage energy and avoid risky weather.','تبادل الأدوار في اختيار مسارات آمنة للصقر الافتراضي. أدر الطاقة وتجنب الطقس الخطر.'),souq:loc('Take turns trading with a shared 100-dirham market budget; each player earns their own points.','تبادلوا التجارة بميزانية سوق مشتركة قدرها ١٠٠ درهم؛ يجمع كل لاعب نقاطه.'),oasis:loc('The family cooperates to build an oasis. Use 12 shared resource units to reach a sustainable outcome.','تتعاون العائلة لبناء واحة. استخدموا ١٢ وحدة موارد مشتركة لتحقيق الاستدامة.')};let out=`<div class="row between"><h2>${g.icon} ${loc(g.en,g.ar)}</h2><button class="alt" onclick="go('home')">← ${t('back')}</button></div><div class="panel"><b>${t('rules')}</b><p>${rules[active]}</p><p class="muted">${loc('Human host:','المضيف:')} ${esc(state.host)} · ${loc('AI content is pre-generated and reviewed; not live AI.','المحتوى مُنشأ مسبقاً بالذكاء الاصطناعي ومراجع؛ وليس توليداً مباشراً.')}</p></div>`;if(!game)return out+`<div class="panel"><p>${t('ready')}</p><button onclick="newGame()">${t('start')}</button></div>`;if(game.finished)return out+finishedView();let sc=scenarios[active][game.scenarioOrder[game.round]],side=isTeam?(game.turn%2===0?t('teamA'):t('teamB')):state.players[game.turn%state.players.length];out+=`<div class="panel"><div class="row between"><span class="pill">${t('round')} ${game.round+1} / 3</span><span class="pill">${t('turn')}: ${esc(side)}</span></div><div class="row" style="margin-top:12px"><div class="stat">${t('time')}<b id="clock">${formatTime(game.seconds)}</b></div>${isFootball?`<div class="stat">${t('teamA')}<b>${game.scoreA}</b></div><div class="stat">${t('teamB')}<b>${game.scoreB}</b></div>`:`<div class="stat">${t('score')}<b>${game.scoreA}</b></div><div class="stat">${loc(active==='souq'?'Budget':active==='oasis'?'Materials':active==='falcon'?'Energy':'Supplies',active==='souq'?'الميزانية':active==='oasis'?'المواد':active==='falcon'?'الطاقة':'المؤن')}<b>${game.resources}</b></div>`}</div><div class="row" style="margin-top:12px"><button onclick="startTimer()">${game.playing?t('pause'):t('start')} ⏱</button><button class="alt" onclick="resetTimer()">↺ ${loc('Reset timer','إعادة المؤقت')}</button>${isFootball?`<button class="gold" onclick="recordGoal('A')">+ ⚽ ${t('teamA')}</button><button class="gold" onclick="recordGoal('B')">+ ⚽ ${t('teamB')}</button><button class="alt" onclick="undoGoal()">↶ ${loc('Undo last goal','تراجع عن آخر هدف')}</button>`:''}</div></div>`;out+=`<div class="panel stack"><b>${t('ai')}</b><p class="muted" style="margin:0">${loc('OFFLINE • AI-assisted, pre-generated and reviewed scenarios. No live AI or automated judging.','دون اتصال • سيناريوهات بمساعدة الذكاء الاصطناعي مُعدة مسبقاً ومراجعة. لا توليد مباشر ولا تحكيم آلي.')}</p><div class="notice">${loc(sc.en,sc.ar)}</div><label>${t('choose')}</label><div class="choices">${sc.opts.map((o,i)=>`<button class="choice ${game.selected===i?'selected':''}" onclick="selectOption(${i})" ${game.outcome?'disabled':''}>${loc(o[0],o[1])}</button>`).join('')}</div>${game.outcome?`<div class="notice success">${esc(game.outcome)}</div>`:''}<div class="row"><button ${game.selected<0||!!game.outcome?'disabled':''} onclick="confirmChoice()">${t('confirm')}</button><button class="alt" ${!game.outcome?'disabled':''} onclick="advance()">${game.round>=2?t('end'):t('next')} →</button><button class="danger" onclick="if(confirm('${loc('Restart this game?','إعادة هذه اللعبة؟')}'))newGame()">${t('reset')}</button></div></div>`;return out}
function selectOption(i){if(!game||game.finished||game.outcome)return;game.selected=i;persistGame();render()}
function recordGoal(team){if(!game||game.finished||active!=='football')return;game[team==='A'?'scoreA':'scoreB']++;game.history.push(team);persistGame();render()}
function undoGoal(){if(!game||!game.history.length)return;let side=game.history.pop();game[side==='A'?'scoreA':'scoreB']=Math.max(0,game[side==='A'?'scoreA':'scoreB']-1);persistGame();render()}
function confirmChoice(){if(!game||game.selected<0||game.outcome)return;let o=scenarios[active][game.scenarioOrder[game.round]].opts[game.selected],gain=o[2],cost=o[3],risk=o[4];if(active!=='football'&&game.resources+cost<0){alert(loc('Not enough resources. Choose a different action.','الموارد غير كافية. اختر إجراءً آخر.'));return}let who=active==='football'||active==='oasis'?(game.turn%2===0?'A':'B'):state.players[game.turn%state.players.length];if(active==='football'){let k=game.turn%2===0?'starsA':'starsB';game[k]+=gain;game.outcome=loc(`Host awarded ${gain} strategy stars. Goals are separate.`,`منح المضيف ${gain} نجوم استراتيجية. الأهداف منفصلة.`)}else{game.resources+=cost;game.risk+=risk;let adjusted=Math.max(0,gain-risk);game.scoreA+=adjusted;game.turnScores[who]=(game.turnScores[who]||0)+adjusted;game.outcome=loc(`Confirmed: +${adjusted} points; resources ${game.resources}; risk +${risk}.`,`تم التأكيد: +${adjusted} نقاط؛ الموارد ${game.resources}؛ المخاطر +${risk}.`)}game.log.push({round:game.round+1,who,choice:game.selected,points:active==='football'?gain:Math.max(0,gain-risk)});persistGame();render()}
function advance(){if(!game||!game.outcome)return;game.round++;game.turn++;game.selected=-1;game.outcome=null;if(game.round>=3){finishGame();return}if(active!=='football'){stopTimer();game.seconds=60}persistGame();render()}
function finishGame(){stopTimer();game.finished=true;let isFootball=active==='football',isOasis=active==='oasis',scores=game.turnScores||{},max=Math.max(0,...Object.values(scores)),leaders=Object.keys(scores).filter(k=>scores[k]===max),winner=isFootball?(game.scoreA>game.scoreB?t('teamA'):game.scoreB>game.scoreA?t('teamB'):t('draw')):isOasis?loc(game.scoreA>=10?'Thriving oasis':'Growing oasis',game.scoreA>=10?'واحة مزدهرة':'واحة نامية'):leaders.length===1?leaders[0]:leaders.length>1?t('draw'):loc('No points earned','لم تُسجل نقاط');let g=gameInfo();state.results[active]={name:g.en,score:game.scoreA,goals:[game.scoreA,game.scoreB],stars:[game.starsA,game.starsB],winner,individual:scores,remaining:game.resources,risk:game.risk,log:game.log,when:new Date().toISOString()};persist();persistGame();render()}
function finishedView(){let r=state.results[active];return `<div class="panel stack"><h2>🏆 ${t('complete')}</h2><h3>${esc(r?.winner||'')}</h3><p>${active==='football'?`${t('teamA')} ${game.scoreA} — ${game.scoreB} ${t('teamB')} · ⭐ ${game.starsA} / ${game.starsB}`:`${t('score')}: ${game.scoreA} · ${loc('Risk','المخاطر')}: ${game.risk} · ${t('remaining')}: ${game.resources}`}</p>${Object.entries(game.turnScores||{}).map(([p,s])=>`<p>${esc(p)}: ${s} ${t('points')}</p>`).join('')}<div class="row"><button onclick="newGame()">${t('new')}</button><button class="alt" onclick="go('results')">${t('results')}</button><button class="alt" onclick="go('home')">${t('back')}</button></div></div>`}
function results(){let entries=games.filter(g=>state.results[g.id]);return `<h2>${t('family')}</h2><div class="grid">${games.map(g=>{let r=state.results[g.id];return `<div class="card"><div class="emoji">${g.icon}</div><h3>${loc(g.en,g.ar)}</h3><p>${r?`${t('complete')} ✓ · ${g.id==='football'?`${r.goals[0]}–${r.goals[1]}`:r.score+' '+t('points')}`:loc('Not played yet','لم تُلعب بعد')}</p>${r?`<p><b>${loc('Result','النتيجة')}:</b> ${esc(r.winner)}</p>`:''}<button onclick="go('play','${g.id}')">${t('play')}</button></div>`}).join('')}</div><div class="panel"><h3>${entries.length} / 5 ${t('complete')}</h3><div class="meter"><span style="width:${entries.length*20}%"></span></div><p class="muted">${loc('Each completed game adds an emblem to the family memory wall.','تضيف كل لعبة مكتملة شارة إلى لوحة ذكريات العائلة.')}</p><h3>${loc('Player achievements','إنجازات اللاعبين')}</h3>${state.players.map(p=>{let score=entries.reduce((sum,g)=>sum+(state.results[g.id].individual?.[p]||0),0);return `<p>${esc(p)}: <strong>${score}</strong> ${t('points')}</p>`}).join('')}<button class="alt" onclick="downloadResults()">↓ ${loc('Download results','تنزيل النتائج')}</button> <button class="danger" onclick="if(confirm('${loc('Clear saved results?','مسح النتائج المحفوظة؟')}')){state.results={};persist();render()}">${t('clear')}</button></div>`}
function downloadResults(){let lines=['LAMMA AI - Family results','Date: '+new Date().toLocaleString(),'Completed: '+Object.keys(state.results).length+'/5',...games.map(g=>{let r=state.results[g.id];return g.en+': '+(r?`score ${r.score}, winner ${r.winner}, ${JSON.stringify(r.individual||{})}`:'not completed')})];let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LAMMA_AI_Family_Results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
try{let prev=JSON.parse(localStorage.getItem('lamma_active')||'null');if(prev&&games.some(g=>g.id===prev.active)&&prev.game&&!prev.game.finished){active=prev.active;game=prev.game;game.playing=false;view='play'}}catch(e){}
render();
</script></body></html>
